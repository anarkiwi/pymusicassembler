name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: black --check
        run: black --check src/pymusicassembler tests scripts
      - name: pylint
        run: pylint src/pymusicassembler tests scripts
      - name: Cache downloads
        # HVSC tunes and the editor P./S. files (csdb.dk release 94388, pinned in
        # tests/fixtures/ma_native.txt) are copyright and never committed;
        # pysidtracker's cache action pre-fetches and persists them.
        uses: anarkiwi/pysidtracker/.github/actions/cache@v0.44.0
        with:
          key: ${{ hashFiles('tests/fixtures/*.txt', 'tests/*.py') }}
          tunes: tests tests/fixtures/ma_corpus.txt
          native: tests/fixtures/ma_native.txt
      - name: pytest + coverage (> 85%)
        # Tunes are HVSC copyright works (never committed); tune-dependent tests
        # fetch them from the HVSC mirror into the cached .tunecache (retrying
        # transient failures; skipping an individual tune only if truly
        # unreachable).  The byte-exact oracle comparison runs in the dedicated
        # ``oracle`` job below (Docker + network), excluded here via ``-m``.
        run: pytest -n auto --cov=pymusicassembler --cov-report=term-missing --cov-fail-under=85

  oracle:
    # Byte-exact comparison of the Music Assembler player render against the
    # sidtrace sidplayfp oracle over real HVSC tunes (one per player variation).
    # Never skipped: a failed HVSC download or oracle render fails the job.
    # HVSC tunes and oracle CSVs are cached.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Cache tunes and oracle traces
        uses: anarkiwi/pysidtracker/.github/actions/cache@v0.44.0
        with:
          key: ${{ hashFiles('tests/test_oracle_*.py', 'tests/fixtures/pathdiff.json') }}
          sidtrace: "true"
          tunes: tests/test_oracle_hvsc.py tests/test_oracle_songs.py tests/fixtures/pathdiff.json
      - name: DIAG
        run: |
          git fetch -q --depth=1 origin 1309bd8f09c9dd74ae4eceff5f8f47f8c1116406
          git worktree add /tmp/old 1309bd8f09c9dd74ae4eceff5f8f47f8c1116406
          PYTHONPATH=scripts python scripts/diag_digimix.py new
          PYTHONPATH=scripts:/tmp/old/src python scripts/diag_digimix.py old

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Smoke test the wheel
        run: |
          pip install dist/*.whl
          python -c "import pymusicassembler; print(pymusicassembler.__version__)"
          pymusicassembler --help
